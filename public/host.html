<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rally dell'AI · Proiettore</title>
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/host.css">
</head>
<body>
  <!-- Un palco fisso 1920x1080, scalato alla finestra del proiettore. -->
  <div id="palco" class="con-pista">
    <!-- Il paesaggio con il sentiero: le squadre salgono verso la vetta. -->
    <svg id="paesaggio" viewBox="0 0 1920 520" width="1920" height="520" aria-hidden="true">
      <g stroke="#2A2420" stroke-width="6" stroke-linejoin="round">
        <!-- colline lontane -->
        <path d="M-10 250 Q 220 170 470 225 T 960 205 T 1420 200 L1420 530 L-10 530 Z" fill="#CFE3C0"/>
        <!-- la vetta -->
        <path d="M1240 530 L1300 300 Q 1420 170 1520 130 Q 1600 100 1660 92 Q 1760 100 1830 170 Q 1890 230 1930 300 L1930 530 Z" fill="#B9D7A8"/>
        <path d="M1560 118 Q 1610 98 1660 92 Q 1720 96 1770 122 L1735 140 L1700 124 L1665 146 L1625 126 L1592 140 Z" fill="#FFFDF7"/>
        <!-- colline vicine -->
        <path d="M-10 380 Q 260 300 560 350 T 1150 360 Q 1300 350 1420 390 L1420 530 L-10 530 Z" fill="#E8CF9A"/>
        <path d="M1380 530 Q 1600 400 1930 420 L1930 530 Z" fill="#E8CF9A"/>
      </g>
      <!-- alberelli -->
      <g stroke="#2A2420" stroke-width="5" stroke-linejoin="round">
        <g transform="translate(330 300)"><line x1="0" y1="0" x2="0" y2="40"/><circle cx="0" cy="-8" r="26" fill="#7CC46A"/></g>
        <g transform="translate(395 318)"><line x1="0" y1="0" x2="0" y2="30"/><circle cx="0" cy="-6" r="19" fill="#9BD37F"/></g>
        <g transform="translate(1050 290)"><line x1="0" y1="0" x2="0" y2="40"/><circle cx="0" cy="-8" r="26" fill="#7CC46A"/></g>
        <g transform="translate(1480 360)"><line x1="0" y1="0" x2="0" y2="34"/><circle cx="0" cy="-6" r="22" fill="#9BD37F"/></g>
        <g transform="translate(700 420)"><line x1="0" y1="0" x2="0" y2="34"/><circle cx="0" cy="-6" r="22" fill="#9BD37F"/></g>
      </g>
      <!-- il sentiero -->
      <path id="strada-bordo" d="M70 470 C 300 500, 420 400, 650 410 S 1000 420, 1150 330 S 1400 210, 1500 180 S 1620 110, 1665 92" />
      <path id="strada" d="M70 470 C 300 500, 420 400, 650 410 S 1000 420, 1150 330 S 1400 210, 1500 180 S 1620 110, 1665 92" />
      <path id="strada-linea" d="M70 470 C 300 500, 420 400, 650 410 S 1000 420, 1150 330 S 1400 210, 1500 180 S 1620 110, 1665 92" />
      <!-- bandiera in vetta -->
      <g stroke="#2A2420" stroke-width="5" stroke-linejoin="round">
        <line x1="1665" y1="92" x2="1665" y2="8" />
        <path d="M1665 10 h70 v44 h-70 z" fill="#FFFDF7"/>
        <path d="M1665 10 h17.5 v11 h-17.5z M1700 10 h17.5 v11 h-17.5z M1682.5 21 h17.5 v11 h-17.5z M1717.5 21 h17.5 v11 h-17.5z M1665 32 h17.5 v11 h-17.5z M1700 32 h17.5 v11 h-17.5z M1682.5 43 h17.5 v11 h-17.5z M1717.5 43 h17.5 v11 h-17.5z" fill="#2A2420" stroke="none"/>
      </g>
      <g id="segni"></g>
      <g id="gettoni"></g>
    </svg>

    <!-- striscia di colline per le schermate senza percorso -->
    <svg id="colline-basse" viewBox="0 0 1920 130" width="1920" height="130" aria-hidden="true">
      <g stroke="#2A2420" stroke-width="6" stroke-linejoin="round">
        <path d="M-10 60 Q 300 0 640 45 T 1300 40 T 1930 30 L1930 140 L-10 140 Z" fill="#CFE3C0"/>
        <path d="M-10 100 Q 400 50 900 90 T 1930 80 L1930 140 L-10 140 Z" fill="#E8CF9A"/>
      </g>
    </svg>

    <header id="testa">
      <div class="marchio"><span class="marchio-icona"></span><span id="titolo"></span></div>
      <div id="pillola" class="pillola"></div>
      <div id="timer" class="timer" hidden></div>
    </header>
    <main id="scena"></main>
  </div>

  <div id="regia" class="regia">
    <button data-cmd="avanti" class="primario" title="Spazio o freccia destra">▶ Avanti</button>
    <button data-cmd="salta" title="N">⏭ Salta</button>
    <button data-cmd="podio" title="P">🏁 Podio</button>
    <button data-azione="precedente" title="[">◀ Partita</button>
    <button data-azione="successiva" title="]">Partita ▶</button>
    <button data-azione="musica" title="M">🎵 Musica</button>
    <button data-cmd="modo" title="G">👤/👥 Singoli/Squadre</button>
    <button data-cmd="bot" title="B">🤖 +6 bot</button>
    <button data-cmd="reset" title="R">↺ Ricomincia</button>
    <button data-azione="csv" title="Scarica i risultati">⬇ CSV</button>
    <button data-azione="schermo" title="F">⛶</button>
    <button data-azione="nascondi" title="H">✕</button>
    <div class="regia-aiuto">Spazio avanti · N salta · P podio · [ ] cambia partita · M musica · G singoli/squadre · B bot · R ricomincia · F schermo intero · H nascondi</div>
  </div>
  <div id="avviso" class="avviso" hidden></div>
  <div id="avviso-audio" class="avviso-audio">🔊 Premi un tasto o clicca per attivare musica e suoni</div>

  <script src="/js/animali.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/suono.js"></script>
  <script src="/js/host.js"></script>
</body>
</html>
